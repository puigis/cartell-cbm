<style>
/* Layout: poster preview beside a short form; one column on phones */
:root {
  --felt: #0d1a14;
  --panel: #13241c;
  --line: #24392e;
  --ink: #ece8d8;
  --muted: #9aa89d;
  --gold: #e8b93f;
  --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-ui: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--felt); color: var(--ink); }
body { font-family: var(--font-ui); font-size: 16px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; align-items: center; gap: 14px; }
header img { width: 46px; height: auto; }
header h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: .04em; margin: 0; line-height: 1.1; text-wrap: balance; }
header p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.stage { min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 820px) { .stage { position: static; } }
canvas#poster { width: 100%; height: auto; display: block; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.55), 0 0 0 1px var(--line); background: #000; }
form { display: grid; gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 12px; }
legend { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 8px; padding: 0; }
label { display: grid; gap: 5px; font-size: .9rem; color: var(--muted); }
input[type=text] { font: inherit; color: var(--ink); background: var(--felt); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
input[type=text]:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: inherit; font-size: .82rem; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--felt); color: var(--muted); cursor: pointer; }
.chips button:hover { color: var(--ink); border-color: var(--gold); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--felt); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 8px 6px; border-radius: 6px; color: var(--muted); cursor: pointer; font-weight: 500; display: block; }
.seg input:checked + label { background: var(--gold); color: #1b1404; }
.seg input:focus-visible + label { outline: 2px solid var(--ink); }
.actions { display: grid; gap: 8px; }
.group { display: grid; gap: 16px; }
[hidden] { display: none !important; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { font: inherit; font-weight: 600; font-size: .98rem; background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tabs button:hover { color: var(--ink); }
.tabs button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
textarea { font: inherit; color: var(--ink); background: var(--felt); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; box-sizing: border-box; resize: vertical; line-height: 1.4; }
textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: transparent; }
.hint { font-size: .8rem; color: var(--muted); margin: -4px 0 0; }
label output { float: right; color: var(--ink); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--gold); }
button.reset { font: inherit; font-size: .85rem; justify-self: start; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button.reset:hover { color: var(--ink); border-color: var(--gold); }
button.primary { font: inherit; font-weight: 600; border-radius: 8px; padding: 12px 14px; cursor: pointer; background: var(--gold); color: #1b1404; border: 1px solid var(--gold); font-size: 1.02rem; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.status { min-height: 1.2em; font-size: .85rem; color: var(--muted); margin: 0; }
.saveview { margin-top: 14px; display: grid; gap: 8px; }
.saveview img { width: 100%; border-radius: 8px; }
.saveview p { margin: 0; color: var(--muted); font-size: .9rem; }
</style>

    <div>
      <h1>Cartell CBM</h1>
      <p>Cartells del CB Monforte</p>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Tipus de cartell">
    <button type="button" role="tab" id="tab-comp" aria-selected="true" data-mode="comp">Cartell competició</button>
    <button type="button" role="tab" id="tab-info" aria-selected="false" data-mode="info">Cartell informatiu</button>
  </nav>

  <div class="grid">
    <div class="stage">
      <canvas id="poster" width="1080" height="1080" aria-label="Previsualització del cartell"></canvas>
      <div class="saveview" id="saveview" hidden>
        <p>Mantén premuda la imatge (o clic dret) i tria «Desa la imatge».</p>
        <img id="saveimg" alt="Cartell a punt per desar">
      </div>
    </div>

    <form id="f" autocomplete="off">
      <div id="formInfo" class="group" hidden>
        <fieldset>
          <legend>Franja de dalt</legend>
          <label>Capçalera
            <input type="text" id="capInfo" value="Nota del club" maxlength="60">
          </label>
        </fieldset>
        <fieldset>
          <legend>Text</legend>
          <label>Missatge
            <textarea id="missatge" rows="7">Informem als socis....</textarea>
          </label>
          <p class="hint">La mida del text s'ajusta sola perquè hi càpiga. Fes salts de línia per separar paràgrafs.</p>
          <div class="seg" role="radiogroup" aria-label="Alineació">
            <input type="radio" name="alin" id="a-c" value="center" checked><label for="a-c">Centrat</label>
            <input type="radio" name="alin" id="a-e" value="left"><label for="a-e">A l'esquerra</label>
          </div>
        </fieldset>
      </div>

      <div id="formComp" class="group">
      <fieldset>
        <legend>Franja de dalt</legend>
        <label>Campionat
          <input type="text" id="campionat" value="Campionat Social de 3 Bandes" maxlength="60">
        </label>
        <div class="chips" id="chips" aria-label="Modalitats ràpides">
          <button type="button">3 Bandes</button><button type="button">Lliure</button><button type="button">Banda</button>
          <button type="button">Quadre</button><button type="button">Biathló</button><button type="button">5 Quilles</button>
          <button type="button">Snooker</button><button type="button">Pool</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Centre</legend>
        <label>Títol
          <input type="text" id="titol" value="Campió" maxlength="14">
        </label>
        <div class="chips" id="titols">
          <button type="button">Campió</button><button type="button">Campiona</button><button type="button">Campions</button><button type="button">Subcampió</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Franja de baix</legend>
        <label>Nom
          <input type="text" id="nom" value="Isaac Puig" maxlength="40" placeholder="p. ex. Luís & Javier">
        </label>
      </fieldset>

      <fieldset>
        <legend>Ajustos</legend>
        <label>Mida del nom <output id="oNom">100%</output>
          <input type="range" id="sNom" min="70" max="130" value="100">
        </label>
        <label>Mida del títol <output id="oTit">100%</output>
          <input type="range" id="sTit" min="70" max="115" value="100">
        </label>
        <label>Llum del fons <output id="oLlum">100%</output>
          <input type="range" id="sLlum" min="40" max="160" value="100">
        </label>
        <button type="button" class="reset" id="reset">Restableix els ajustos</button>
      </fieldset>
      </div>

      <fieldset>
        <legend>Format</legend>
        <div class="seg" role="radiogroup" aria-label="Format">
          <input type="radio" name="format" id="f-sq" value="1080" checked><label for="f-sq">Quadrat 1:1</label>
          <input type="radio" name="format" id="f-v" value="1350"><label for="f-v">Vertical 4:5</label>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="primary">Descarrega la imatge</button>
        <p class="status" id="status" aria-live="polite"></p>
      </div>
    </form>
  </div>

function bestLines(c, text) {
  const words = text.split(/\s+/).filter(Boolean);
  if (words.length < 2) return [words.join(" ")];
  let best = null;
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0, i).join(" "), b = words.slice(i).join(" ");
    const m = Math.max(c.measureText(a).width, c.measureText(b).width);
    if (!best || m < best.m) best = { m, lines: [a, b] };
  }
  return best.lines;
}

function fitBlock(c, text, font, start, w, h, lh, sp = 0) {
  for (let s = start; s > 12; s -= 1) {
    c.font = font.replace("{s}", s); c.letterSpacing = (s * sp) + "px";
    if (c.measureText(text).width <= w && s * lh <= h) return { s, lines: [text] };
    if (s < start * .78) { const L = bestLines(c, text); if (L.length * s * lh <= h && L.every(l => c.measureText(l).width <= w)) return { s, lines: L }; }
  }

}

  c.fillStyle = foil(c, -h * .2, 0); c.beginPath(); c.roundRect(-w * .45, -h * .2, w * .9, h * .2, h * .05); c.fill(); c.stroke();
  [-.28, 0, .28].forEach((dx, i) => { c.fillStyle = i === 1 ? "#b3121d" : "#0f4a2e"; c.beginPath(); c.ellipse(w * dx, -h * .1, w * .045, h * .06, 0, 0, Math.PI * 2); c.fill(); });
  // balls on the points
  pts.forEach(([px, py], i) => {
    const r = w * (i === 2 ? .07 : .055), x = w * px, y = h * py - r * .8;
    const col = i === 2 ? ["#ff8a8a", "#b3121d", "#4a0408"] : (i % 2 ? ["#fff7c2", "#e7b923", "#6d4f05"] : ["#ffffff", "#f1ede2", "#8f8a7a"]);
    const g = c.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); g.addColorStop(0, col[0]); g.addColorStop(.45, col[1]); g.addColorStop(1, col[2]);

}
function ball(c, x, y, r, col) {
  const g = c.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
  g.addColorStop(0, col[0]); g.addColorStop(.45, col[1]); g.addColorStop(1, col[2]);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
}

function draw() { (mode === "info" ? drawInfo : drawComp)(); }

function drawComp() {
  const K = { nom: $("sNom").value / 100, tit: $("sTit").value / 100, llum: $("sLlum").value / 100 };
  $("oNom").value = $("sNom").value + "%"; $("oTit").value = $("sTit").value + "%"; $("oLlum").value = $("sLlum").value + "%";
  const W = 1080, H = +document.querySelector("input[name=format]:checked").value, u = W / 1080;
  if (cv.height !== H) cv.height = H;
  ctx.letterSpacing = "0px";

  // background: the club hall, blurred and toned to the club's green and gold
  ctx.fillStyle = "#06150e"; ctx.fillRect(0, 0, W, H);
  if (hall.complete && hall.naturalWidth) {
    const sc = Math.max(W / hall.naturalWidth, H / hall.naturalHeight) * 1.04, iw = hall.naturalWidth * sc, ih = hall.naturalHeight * sc;
    ctx.globalAlpha = Math.min(1, .9 * K.llum); ctx.drawImage(hall, (W - iw) / 2, (H - ih) / 2, iw, ih); ctx.globalAlpha = 1;
  }
  // a pool of lamp light behind the title
  const topH = 200 * u, botH = (H > 1100 ? 290 : 260) * u * (.85 + .15 * K.nom), midY = topH + (H - topH - botH) * .52;
  const lamp = ctx.createRadialGradient(W / 2, midY, 10 * u, W / 2, midY, W * .62);
  lamp.addColorStop(0, `rgba(255,226,150,${(.3 * K.llum).toFixed(3)})`); lamp.addColorStop(.5, "rgba(255,210,120,.08)"); lamp.addColorStop(1, "rgba(0,0,0,.45)");
  ctx.fillStyle = lamp; ctx.fillRect(0, 0, W, H);

  // signature: a three-cushion line traced in gold, from corner to corner
  ctx.save();
  ctx.strokeStyle = "rgba(232,198,110,.45)"; ctx.lineWidth = 2 * u; ctx.setLineDash([1 * u, 9 * u]); ctx.lineCap = "round";
  const path = [[W * .08, H - botH - 40 * u], [W * .97, topH + (H - topH - botH) * .2], [W * .62, topH + 6 * u], [W * .03, topH + (H - topH - botH) * .42], [W * .9, H - botH - 22 * u]];
  ctx.beginPath(); ctx.moveTo(...path[0]); path.slice(1).forEach(p => ctx.lineTo(...p)); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 10 * u; ctx.shadowOffsetY = 4 * u;
  ball(ctx, path[0][0], path[0][1], 15 * u, ["#ffffff", "#efebe0", "#7f7a6c"]);
  ball(ctx, path[4][0] + 18 * u, path[4][1] - 6 * u, 15 * u, ["#ff9a9a", "#b3121d", "#3d0306"]);
  ctx.restore();

  band(ctx, H - botH, botH, W, u, false);
  topBand(W, u, topH, $("campionat").value.trim());

  // the title, in gold foil
  const title = ($("titol").value.trim() || " ").toUpperCase();
  const FTi = "900 {s}px " + SERIF, sp = .05;
  let ts = 220 * u * K.tit;
  ctx.font = FTi.replace("{s}", ts); ctx.letterSpacing = (ts * sp) + "px";
  let tw2 = ctx.measureText(title).width - ts * sp;
  if (tw2 > W - 150 * u) { ts *= (W - 150 * u) / tw2; ctx.font = FTi.replace("{s}", ts); ctx.letterSpacing = (ts * sp) + "px"; tw2 = ctx.measureText(title).width - ts * sp; }
  const ty = midY + ts * .2, tx = (W - tw2) / 2;
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  const capTop = ty - ts * .72;
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.7)"; ctx.shadowBlur = 34 * u; ctx.shadowOffsetY = 14 * u;
  ctx.fillStyle = "#2b1d05"; ctx.fillText(title, tx, ty + 3 * u); ctx.restore();
  ctx.fillStyle = foil(ctx, capTop, ty); ctx.fillText(title, tx, ty);
  ctx.lineWidth = 1.5 * u; ctx.strokeStyle = "rgba(255,246,210,.55)"; ctx.strokeText(title, tx, ty - 1 * u);
  // crown on the first letter
  ctx.letterSpacing = "0px";
  const fw = ctx.measureText(title[0]).width;
  crown(ctx, tx + fw * .5, capTop - 10 * u, Math.max(fw * .92, 110 * u), u);

  // ornament under the title: rule + three caroms
  const oy = ty + 48 * u, half = Math.min(tw2 / 2, 300 * u);
  goldRule(ctx, W / 2 - half, W / 2 - 46 * u, oy, u, false); goldRule(ctx, W / 2 + 46 * u, W / 2 + half, oy, u, false);
  [[-26, ["#ffffff", "#efebe0", "#7f7a6c"]], [0, ["#ff9a9a", "#b3121d", "#3d0306"]], [26, ["#fff7c2", "#e7b923", "#6d4f05"]]].forEach(([dx, col]) => ball(ctx, W / 2 + dx * u, oy + 1 * u, 9 * u, col));

  // the name, set in an italic serif
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const FN = "italic 700 {s}px " + ITAL;
  const nom = fitBlock(ctx, $("nom").value.trim(), FN, 150 * u * K.nom, W - 90 * u, botH - 50 * u, 1.05);
  ctx.font = FN.replace("{s}", nom.s); ctx.letterSpacing = "0px";
  nom.lines.forEach((l, i) => {
    const y = H - botH / 2 + 8 * u + (i - (nom.lines.length - 1) / 2) * nom.s * 1.05;
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 14 * u; ctx.shadowOffsetY = 4 * u;
    ctx.fillStyle = foil(ctx, y - nom.s * .5, y + nom.s * .4); ctx.fillText(l, W / 2, y); ctx.restore();
  });
  $("saveview").hidden = true;
}

/* top band shared by both posters */
function topBand(W, u, topH, text) {
  band(ctx, 0, topH, W, u, true);
  const cH = topH - 56 * u, cW = cH * (crest.naturalWidth / crest.naturalHeight || .73), cX = 48 * u, cY = (topH - 10 * u - cH) / 2;
  if (crest.complete && crest.naturalWidth) {
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 16 * u; ctx.shadowOffsetY = 4 * u;
    ctx.drawImage(crest, cX, cY, cW, cH); ctx.restore();
  }
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const tx0 = cX + cW + 30 * u, tx1 = W - 50 * u, tw = tx1 - tx0, tcx = tx0 + tw / 2;
  const FT = "700 {s}px " + SERIF;
  const top = fitBlock(ctx, text.toUpperCase(), FT, 52 * u, tw, topH - 70 * u, 1.25, .08);
  ctx.font = FT.replace("{s}", top.s); ctx.letterSpacing = (top.s * .08) + "px";
  top.lines.forEach((l, i) => {
    const y = topH / 2 - 4 * u + (i - (top.lines.length - 1) / 2) * top.s * 1.25;
    ctx.fillStyle = "#f2e6c4"; ctx.fillText(l, tcx + top.s * .04, y);
  });
  ctx.letterSpacing = "0px";
}

/* wrap paragraphs to a width; returns lines with paragraph breaks marked */
function wrapParas(c, text, w) {
  const out = [];
  text.split(/\n/).forEach((para, pi) => {
    if (pi) out.push(null);
    const words = para.split(/\s+/).filter(Boolean); let cur = "";
    if (!words.length) return;
    for (const wd of words) { const t = cur ? cur + " " + wd : wd; if (c.measureText(t).width <= w || !cur) cur = t; else { out.push(cur); cur = wd; } }
    out.push(cur);
  });
  return out;
}

function drawInfo() {
  const W = 1080, H = +document.querySelector("input[name=format]:checked").value, u = W / 1080;
  if (cv.height !== H) cv.height = H;
  ctx.letterSpacing = "0px";
  const topH = 200 * u, botH = 84 * u;
  // white page with the club hall as a very soft watermark
  ctx.fillStyle = "#faf8f2"; ctx.fillRect(0, 0, W, H);
  if (hallG.complete && hallG.naturalWidth) {
    const sc = Math.max(W / hallG.naturalWidth, H / hallG.naturalHeight) * 1.04, iw = hallG.naturalWidth * sc, ih = hallG.naturalHeight * sc;
    ctx.globalAlpha = .13; ctx.drawImage(hallG, (W - iw) / 2, (H - ih) / 2, iw, ih); ctx.globalAlpha = 1;
  }
  const wash = ctx.createRadialGradient(W / 2, H / 2, W * .15, W / 2, H / 2, W * .75);
  wash.addColorStop(0, "rgba(250,248,242,.55)"); wash.addColorStop(1, "rgba(250,248,242,0)");
  ctx.fillStyle = wash; ctx.fillRect(0, 0, W, H);

  topBand(W, u, topH, $("capInfo").value.trim());
  // smaller bottom band with the three caroms
  band(ctx, H - botH, botH, W, u, false);
  const by = H - botH / 2 + 3 * u;
  [[-30, ["#ffffff", "#efebe0", "#7f7a6c"]], [0, ["#ff9a9a", "#b3121d", "#3d0306"]], [30, ["#fff7c2", "#e7b923", "#6d4f05"]]].forEach(([dx, col]) => ball(ctx, W / 2 + dx * u, by, 10 * u, col));

  // message: bold serif, as large as fits
  const ink = "#0b2e1d", padX = 90 * u;
  const sigGap = 36 * u;
  const boxTop = topH + 64 * u, boxBot = H - botH - 150 * u, boxW = W - padX * 2, boxH = boxBot - boxTop;
  const msg = $("missatge").value.replace(/\r/g, "").trim() || " ";
  const FM = "700 {s}px " + ITAL, LH = 1.32;
  let size = 24 * u, lines = [];
  for (let s = 104 * u; s >= 24 * u; s -= 1 * u) {
    ctx.font = FM.replace("{s}", s);
    const L = wrapParas(ctx, msg, boxW);
    const h = L.reduce((a, l) => a + (l === null ? s * .55 : s * LH), 0);
    if (h <= boxH && L.every(l => l === null || ctx.measureText(l).width <= boxW)) { size = s; lines = L; break; }
  }
  if (!lines.length) { ctx.font = FM.replace("{s}", size); lines = wrapParas(ctx, msg, boxW); }
  ctx.font = FM.replace("{s}", size);
  const totalH = lines.reduce((a, l) => a + (l === null ? size * .55 : size * LH), 0);
  const align = document.querySelector("input[name=alin]:checked").value;
  ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillStyle = ink;
  const x = align === "left" ? padX : W / 2;
  let y = boxTop + (boxH - totalH) / 2;
  lines.forEach(l => { if (l === null) { y += size * .55; return; } ctx.fillText(l, x, y + size * LH / 2); y += size * LH; });

  // signature, always the same, bold and right-aligned
  const sigSize = Math.max(26 * u, Math.min(40 * u, size * .5));
  const sy = H - botH - 64 * u;
  ctx.font = `700 ${sigSize}px ${SERIF}`; ctx.letterSpacing = (sigSize * .06) + "px";
  const sw = ctx.measureText(SIGNATURA).width;
  const g = ctx.createLinearGradient(W - padX - sw, 0, W - padX, 0);
  g.addColorStop(0, "rgba(176,132,40,0)"); g.addColorStop(.3, "#b08428"); g.addColorStop(1, "#b08428");
  ctx.fillStyle = g; ctx.fillRect(W - padX - sw, sy - sigSize * .95, sw, 2 * u);
  ctx.textAlign = "right"; ctx.fillStyle = ink; ctx.fillText(SIGNATURA, W - padX + sigSize * .06, sy);
  ctx.letterSpacing = "0px";
  $("saveview").hidden = true;
}

/* tabs */
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b ? "true" : "false"));
  $("formComp").hidden = mode !== "comp"; $("formInfo").hidden = mode !== "info";
  try { localStorage.setItem("cbm-mode", mode); } catch (e) {}
  draw();
}));
try { const m = localStorage.getItem("cbm-mode"); if (m === "info") $("tab-info").click(); } catch (e) {}

/* form wiring */
$("chips").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  $("campionat").value = "Campionat Social de " + e.target.textContent; draw();
});
$("titols").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  $("titol").value = e.target.textContent; draw();
});
$("reset").addEventListener("click", () => { ["sNom", "sTit", "sLlum"].forEach(id => $(id).value = 100); draw(); });
$("f").addEventListener("input", () => requestAnimationFrame(draw));
$("f").addEventListener("change", () => requestAnimationFrame(draw));

function fileName() {
  const slug = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  if (mode === "info") return `${slug($("capInfo").value) || "nota"}-${new Date().toISOString().slice(0, 10)}.png`;
  return `${slug($("titol").value) || "campio"}-${slug($("nom").value) || "cartell"}.png`;
}
function showForSaving() {
  $("saveimg").src = cv.toDataURL("image/png");
  $("saveview").hidden = false;
  $("saveview").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
let downloads = null;
(async () => { try { downloads = await window.claude?.use?.("downloads"); } catch (e) { downloads = null; } })();
$("f").addEventListener("submit", e => {
  e.preventDefault(); draw();
  if (!downloads && !window.claude) { const a = document.createElement("a"); a.href = cv.toDataURL("image/png"); a.download = fileName(); document.body.appendChild(a); a.click(); a.remove(); $("status").textContent = "Imatge descarregada."; return; }
  if (!downloads) { showForSaving(); $("status").textContent = ""; return; }
  cv.toBlob(async blob => {
    try { await downloads.save({ filename: fileName(), data: blob }); $("status").textContent = "Imatge desada."; }
    catch (err) {
      if (err && err.code === "declined") $("status").textContent = "Descàrrega cancel·lada.";
      else { $("status").textContent = "No s'ha pogut descarregar; desa-la des de la imatge de sota."; showForSaving(); }
    }
  }, "image/png");
});

crest.onload = draw; hall.onload = draw; hallG.onload = draw;
Promise.all([document.fonts.load(`900 200px ${SERIF}`), document.fonts.load(`700 50px ${SERIF}`), document.fonts.load(`italic 700 90px ${ITAL}`), document.fonts.load(`700 60px ${ITAL}`)]).catch(() => {}).finally(draw);
draw();
</script>
